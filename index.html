<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadstick CSAR & Logistics Dispatch</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-gold: #d4af37;
            --accent-red: #da3633;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 100%;
            max-width: 600px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: var(--accent-gold);
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.85rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .comms-box {
            background-color: rgba(212, 175, 55, 0.05);
            border: 1px solid var(--accent-gold);
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .comms-box p {
            margin: 0 0 8px 0;
            font-size: 0.85rem;
            color: var(--accent-gold);
        }

        .vdo-link {
            display: inline-block;
            background-color: var(--accent-gold);
            color: #000;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .vdo-link:hover {
            opacity: 0.9;
        }

        button.submit-btn {
            width: 100%;
            background-color: var(--accent-red);
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button.submit-btn:hover {
            background-color: #b82a28;
        }

        button.submit-btn:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
            color: var(--text-muted);
        }

        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        .status-msg.success {
            background-color: rgba(46, 160, 67, 0.15);
            border: 1px solid #2ea043;
            color: #3fb950;
            display: block;
        }

        .status-msg.error {
            background-color: rgba(218, 54, 51, 0.15);
            border: 1px solid var(--accent-red);
            color: #f85149;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Deadstick Dispatch Terminal</h1>
        <p>Search & Rescue (CSAR) | Field Logistics | Emergency Contracting</p>
    </div>

    <div class="comms-box">
        <p><strong>IMMEDIATE VOICE LINK REQUIRED?</strong></p>
        <a href="https://vdo.ninja/?room=DeadstickDispatch" target="_blank" class="vdo-link">Join Zero-Friction Comms (VDO.ninja)</a>
    </div>

    <form id="dispatchForm">
        <div class="form-group">
            <label for="clientName">Client Handle / RSI Moniker *</label>
            <input type="text" id="clientName" required placeholder="e.g. Cmdr_Lanc">
        </div>

        <div class="form-group">
            <label for="serviceType">Requested Assistance *</label>
            <select id="serviceType" required>
                <option value="CSAR - Medical Extraction">CSAR - Medical Extraction / Rescue</option>
                <option value="Logistics - Fuel / Repair Supply">Logistics - Fuel / Ammunition / Resupply</option>
                <option value="Escort - Combat Support">Escort - Tactical Escort / Overwatch</option>
                <option value="Recovery - Asset Salvage">Recovery - Ship / Gear Salvage</option>
            </select>
        </div>

        <div class="form-group">
            <label for="location">Current Sector / System / Marker *</label>
            <input type="text" id="location" required placeholder="e.g. MicroTech - OM-2 / Ghost Hollow">
        </div>

        <div class="form-group">
            <label for="threatLevel">Threat Level *</label>
            <select id="threatLevel" required>
                <option value="Green - Cold (No hostile contact)">Green - Clear / Secure Space</option>
                <option value="Yellow - Moderate (Hostiles in area)">Yellow - Elevated / Hostiles Proximity</option>
                <option value="Red - Hot (Active combat / Downed)">Red - Active Hostile Engagement</option>
            </select>
        </div>

        <div class="form-group">
            <label for="details">Tactical Brief / Operational Notes</label>
            <textarea id="details" placeholder="Specify ship type, injuries, hostile counts, or special access codes..."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">Transmit Emergency Signal</button>
        <div id="statusMsg" class="status-msg"></div>
    </form>
</div>

<script>
    // Primary Target Discord Webhook
    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1567689888495829112/6r3Zuvtg1Jn0dbq1uPTWm0y0fcuwnxowMpXog99A0VRr_WKYF-zHpw9gpgl_RYhLvbFx";
    const CORS_PROXY = "https://corsproxy.io/?";

    const form = document.getElementById('dispatchForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Prevent dual-submission loops
        submitBtn.disabled = true;
        submitBtn.innerText = "Transmitting...";
        statusMsg.className = "status-msg";
        statusMsg.style.display = "none";

        const payload = {
            embeds: [{
                title: "🚨 EMERGENCY DISPATCH REQUEST RECEIVED",
                color: 14331703, // Crimson
                fields: [
                    { name: "Client Moniker", value: document.getElementById('clientName').value, inline: true },
                    { name: "Service Required", value: document.getElementById('serviceType').value, inline: true },
                    { name: "Location / Sector", value: document.getElementById('location').value, inline: false },
                    { name: "Threat Level", value: document.getElementById('threatLevel').value, inline: true },
                    { name: "Operational Briefing", value: document.getElementById('details').value || "None provided.", inline: false }
                ],
                timestamp: new Date().toISOString(),
                footer: { text: "Deadstick PMC | Automated Dispatch System" }
            }]
        };

        try {
            // Attempt 1: Direct Fetch
            let response = await fetch(DISCORD_WEBHOOK, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            // Attempt 2: Proxy Failover if CORS or Direct Delivery Fails
            if (!response.ok) {
                const proxyUrl = CORS_PROXY + encodeURIComponent(DISCORD_WEBHOOK);
                response = await fetch(proxyUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            }

            if (response.ok || response.status === 204) {
                statusMsg.className = "status-msg success";
                statusMsg.innerText = "Signal Transmitted Successfully. Stand by for Operator contact.";
                form.reset();
            } else {
                throw new Error(`HTTP Error Status: ${response.status}`);
            }
        } catch (err) {
            console.error("Transmission error:", err);
            statusMsg.className = "status-msg error";
            statusMsg.innerText = "Transmission Failed. Connect via VDO.ninja voice channel directly.";
        } finally {
            // Re-enable button after 5-second cooldown
            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Transmit Emergency Signal";
            }, 5000);
        }
    });
</script>

</body>
</html>
