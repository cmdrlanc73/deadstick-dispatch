<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadstick CSAR & Logistics Dispatch</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-gold: #d4af37;
            --accent-red: #da3633;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 100%;
            max-width: 600px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: var(--accent-gold);
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.85rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button.submit-btn {
            width: 100%;
            background-color: var(--accent-red);
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        button.submit-btn:hover {
            background-color: #b82a28;
        }

        /* Standby / Success Screen */
        .standby-screen {
            display: none;
            text-align: center;
            padding: 30px 20px;
        }

        .standby-screen h2 {
            color: var(--accent-gold);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .standby-screen p {
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .clipboard-box {
            background-color: var(--bg-color);
            border: 1px dashed var(--accent-gold);
            padding: 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--accent-gold);
            margin-bottom: 20px;
            word-break: break-all;
            text-align: left;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--accent-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Deadstick Dispatch Terminal</h1>
        <p>Search & Rescue (CSAR) | Field Logistics | Emergency Contracting</p>
    </div>

    <!-- Active Form View -->
    <form id="dispatchForm">
        <div class="form-group">
            <label for="clientName">Client Handle / RSI Moniker *</label>
            <input type="text" id="clientName" required placeholder="e.g. Cmdr_Riker">
        </div>

        <div class="form-group">
            <label for="serviceType">Requested Assistance *</label>
            <select id="serviceType" required>
                <option value="CSAR - Medical Extraction">CSAR - Medical Extraction / Rescue</option>
                <option value="Logistics - Fuel / Repair Supply">Logistics - Fuel / Ammunition / Resupply</option>
                <option value="Escort - Combat Support">Escort - Tactical Escort / Overwatch</option>
                <option value="Recovery - Asset Salvage">Recovery - Ship / Gear Salvage</option>
            </select>
        </div>

        <div class="form-group">
            <label for="location">Current Sector / System / Marker *</label>
            <input type="text" id="location" required placeholder="e.g. MicroTech - OM-2 / Ghost Hollow">
        </div>

        <div class="form-group">
            <label for="threatLevel">Threat Level *</label>
            <select id="threatLevel" required>
                <option value="Green - Cold (No hostile contact)">Green - Clear / Secure Space</option>
                <option value="Yellow - Moderate (Hostiles in area)">Yellow - Elevated / Hostiles Proximity</option>
                <option value="Red - Hot (Active combat / Downed)">Red - Active Hostile Engagement</option>
            </select>
        </div>

        <div class="form-group">
            <label for="details">Tactical Brief / Operational Notes</label>
            <textarea id="details" placeholder="Specify ship type, injuries, hostile counts, or special access codes..."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">Transmit Emergency Signal</button>
    </form>

    <!-- Standby / Clipboard Transition Screen -->
    <div id="standbyScreen" class="standby-screen">
        <div class="spinner"></div>
        <h2>Signal Locked & Copied</h2>
        <p>Your tactical brief has been copied to your clipboard.<br><strong>Paste this into Discord</strong> when comms open.</p>
        <div class="clipboard-box" id="previewBox"></div>
        <p style="font-size: 0.8rem; color: var(--text-muted);">Redirecting to secure comms channel...</p>
    </div>
</div>

<script>
    const form = document.getElementById('dispatchForm');
    const standbyScreen = document.getElementById('standbyScreen');
    const previewBox = document.getElementById('previewBox');
    const DISCORD_LINK = "https://discord.gg/4w3xqYH7kd";

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        // Gather form values
        const client = document.getElementById('clientName').value;
        const service = document.getElementById('serviceType').value;
        const location = document.getElementById('location').value;
        const threat = document.getElementById('threatLevel').value;
        const details = document.getElementById('details').value || "None provided.";

        // Format into a clean tactical dispatch block
        const dispatchText = `🚨 **EMERGENCY DISPATCH REQUEST** 🚨\n• **Client:** ${client}\n• **Service:** ${service}\n• **Location:** ${location}\n• **Threat Level:** ${threat}\n• **Notes:** ${details}`;

        // Copy to clipboard
        navigator.clipboard.writeText(dispatchText).catch(err => {
            console.error("Clipboard write failed", err);
        });

        // Show standby screen with preview
        form.style.display = 'none';
        previewBox.innerText = dispatchText;
        standbyScreen.style.display = 'block';

        // Redirect to Discord after 3 seconds
        setTimeout(() => {
            window.location.href = DISCORD_LINK;
        }, 3000);
    });
</script>

</body>
</html>
