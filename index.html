<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadstick CSAR & Logistics Dispatch</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-gold: #d4af37;
            --accent-red: #da3633;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 100%;
            max-width: 600px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: var(--accent-gold);
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.85rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button.submit-btn {
            width: 100%;
            background-color: var(--accent-red);
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        button.submit-btn:hover {
            background-color: #b82a28;
        }

        button.submit-btn:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
            color: var(--text-muted);
        }

        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
            background-color: rgba(46, 160, 67, 0.15);
            border: 1px solid #2ea043;
            color: #3fb950;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Deadstick Dispatch Terminal</h1>
        <p>Search & Rescue (CSAR) | Field Logistics | Emergency Contracting</p>
    </div>

    <form action="https://api.web3forms.com/submit" method="POST" id="dispatchForm">
        <!-- Replace value below with your Web3Forms access key string -->
        <input type="hidden" name="access_key" value="54718139-405f-4434-97ff-90c38129e383">
        <input type="hidden" name="subject" value="🚨 EMERGENCY DISPATCH REQUEST RECEIVED">

        <div class="form-group">
            <label for="clientName">Client Handle / RSI Moniker *</label>
            <input type="text" id="clientName" name="Client Handle" required placeholder="e.g. Cmdr_Riker">
        </div>

        <div class="form-group">
            <label for="serviceType">Requested Assistance *</label>
            <select id="serviceType" name="Service Type" required>
                <option value="CSAR - Medical Extraction">CSAR - Medical Extraction / Rescue</option>
                <option value="Logistics - Fuel / Repair Supply">Logistics - Fuel / Ammunition / Resupply</option>
                <option value="Escort - Combat Support">Escort - Tactical Escort / Overwatch</option>
                <option value="Recovery - Asset Salvage">Recovery - Ship / Gear Salvage</option>
            </select>
        </div>

        <div class="form-group">
            <label for="location">Current Sector / System / Marker *</label>
            <input type="text" id="location" name="Location" required placeholder="e.g. MicroTech - OM-2 / Ghost Hollow">
        </div>

        <div class="form-group">
            <label for="threatLevel">Threat Level *</label>
            <select id="threatLevel" name="Threat Level" required>
                <option value="Green - Cold (No hostile contact)">Green - Clear / Secure Space</option>
                <option value="Yellow - Moderate (Hostiles in area)">Yellow - Elevated / Hostiles Proximity</option>
                <option value="Red - Hot (Active combat / Downed)">Red - Active Hostile Engagement</option>
            </select>
        </div>

        <div class="form-group">
            <label for="details">Tactical Brief / Operational Notes</label>
            <textarea id="details" name="Operational Notes" placeholder="Specify ship type, injuries, hostile counts, or special access codes..."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">Transmit Emergency Signal</button>
        <div id="statusMsg" class="status-msg">Signal Transmitted Successfully. Stand by for Operator contact.</div>
    </form>
</div>

<script>
    const form = document.getElementById('dispatchForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', () => {
        submitBtn.disabled = true;
        submitBtn.innerText = "Transmitting...";
        statusMsg.style.display = "block";
    });
</script>

</body>
</html>
